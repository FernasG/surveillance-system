networks:
  guard-network:
    name: guard-network
    driver: bridge

services:
  pi-guard:
    image: pi-guard:latest
    build:
      context: .
      dockerfile: guard/Dockerfile
    container_name: pi-guard
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./guard:/app/guard
      - ./videos:/app/videos
      - ./data:/app/data
      - ./.env:/app/.env
    ports:
      - 3000:3000
    depends_on:
      - chromadb
      - clip-api
      - gemma-api
    devices:
      - "/dev/video0:/dev/video0"
    networks:
      - guard-network

  guard-worker:
    image: pi-guard:latest
    build:
      context: .
      dockerfile: guard/Dockerfile
    container_name: guard-worker
    command: ["python", "-m", "guard.worker.main"]
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./guard:/app/guard
      - ./videos:/app/videos
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      - chromadb
      - redis
      - clip-api
      # - qwen-api
      - liquid-api
    networks:
      - guard-network

  guard-description-worker:
    image: pi-guard:latest
    build:
      context: .
      dockerfile: guard/Dockerfile
    container_name: guard-description-worker
    command: ["python", "-m", "guard.worker.description_main"]
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./guard:/app/guard
      - ./videos:/app/videos
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      - chromadb
      - redis
      - liquid-api
    networks:
      - guard-network

  clip-api:
    build:
      context: ./clip-api
      dockerfile: Dockerfile
    image: clip-api:latest
    container_name: clip-api
    environment:
      - CLIP_MODEL=ViT-B/32
    ports:
      - "8083:8083"
    networks:
      - guard-network

  watcher:
    image: watcher:latest
    build:
      context: ./watcher
      dockerfile: Dockerfile
    container_name: watcher
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./videos:/app/videos
      - ./.env:/app/.env
    depends_on:
      - redis
    networks:
      - guard-network

  llama-downloader:
    image: alpine:latest
    container_name: llama-downloader
    volumes:
      - ./llama.cpp/models:/models
      - ./llama.cpp/scripts:/scripts
    command: sh /scripts/download_models.sh
    networks:
      - guard-network

  # qwen-api:
  #   build:
  #     context: ./llama.cpp
  #     dockerfile: Dockerfile
  #   image: custom-llama-cpp:latest
  #   container_name: qwen-api
  #   ports:
  #     - "8081:8081"
  #   volumes:
  #     - ./llama.cpp/models:/models
  #     - ./llama.cpp/scripts:/scripts
  #   entrypoint: ["/bin/sh", "/scripts/start_qwen.sh"]
  #   depends_on:
  #     llama-downloader:
  #       condition: service_completed_successfully
  #   networks:
  #     - guard-network

  liquid-api:
    build:
      context: ./llama.cpp
      dockerfile: Dockerfile
    image: custom-llama-cpp:latest
    container_name: liquid-api
    ports:
      - "8081:8081"
    volumes:
      - ./llama.cpp/models:/models
      - ./llama.cpp/scripts:/scripts
    entrypoint: ["/bin/sh", "/scripts/start_liquid.sh"]
    depends_on:
      llama-downloader:
        condition: service_completed_successfully
    networks:
      - guard-network

  gemma-api:
    build:
      context: ./llama.cpp
      dockerfile: Dockerfile
    image: custom-llama-cpp:latest
    container_name: gemma-api
    ports:
      - "8082:8082"
    volumes:
      - ./llama.cpp/models:/models
      - ./llama.cpp/scripts:/scripts
    entrypoint: ["/bin/sh", "/scripts/start_gemma.sh"]
    depends_on:
      llama-downloader:
        condition: service_completed_successfully
    networks:
      - guard-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - 8000:8000
    restart: unless-stopped
    volumes:
      - ./chroma_data:/chroma/chroma
    networks:
      - guard-network

  redis:
    image: redis:alpine
    restart: always
    container_name: redis
    ports:
      - 6379:6379
    networks:
      - guard-network
