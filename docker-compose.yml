networks:
  guard-network:
    name: guard-network
    driver: bridge

services:
  pi-guard:
    image: pi-guard:latest
    build:
      context: .
      dockerfile: guard/Dockerfile
    container_name: pi-guard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - LIVE_STREAM_URL=rtsp://${RTSP_USER:?}:${RTSP_PASSWORD:?}@host.docker.internal:${RTSP_PORT:-8554}/${LIVE_CAMERA:-cam1}
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./videos:/app/videos
      - ./data:/app/data
    ports:
      - 3000:3000
    depends_on:
      - chromadb
      - clip-api
      - qwen-api
    networks:
      - guard-network

  guard-worker:
    image: pi-guard:latest
    container_name: guard-worker
    restart: unless-stopped
    command: ["python", "-m", "guard.worker.main"]
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./videos:/app/videos
      - ./data:/app/data
    depends_on:
      - chromadb
      - redis
      - clip-api
      - qwen-api
    networks:
      - guard-network

  guard-enrichment-worker:
    image: pi-guard:latest
    container_name: guard-enrichment-worker
    restart: unless-stopped
    command: ["python", "-m", "guard.worker.enrichment_main"]
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./videos:/app/videos
      - ./data:/app/data
    depends_on:
      - chromadb
      - redis
      - qwen-api
    networks:
      - guard-network

  clip-api:
    build:
      context: ./clip-api
      dockerfile: Dockerfile
    image: clip-api:latest
    container_name: clip-api
    restart: unless-stopped
    environment:
      - CLIP_MODEL=ViT-B/32
    networks:
      - guard-network

  recorder:
    image: recorder:latest
    build:
      context: ./recorder
      dockerfile: Dockerfile
    container_name: recorder
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - TZ=America/Sao_Paulo
      - RTSP_URL=rtsp://${RTSP_USER:?}:${RTSP_PASSWORD:?}@host.docker.internal:${RTSP_PORT:-8554}
      - RECORD_CAMERAS=${RECORD_CAMERAS:-cam1}
      - RECORD_SEGMENT_SECONDS=${RECORD_SEGMENT_SECONDS:-3600}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./videos:/app/videos
    networks:
      - guard-network

  watcher:
    image: watcher:latest
    build:
      context: ./watcher
      dockerfile: Dockerfile
    container_name: watcher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./videos:/app/videos
    depends_on:
      - redis
    networks:
      - guard-network

  llama-downloader:
    image: alpine:3.24.2
    container_name: llama-downloader
    volumes:
      - ./llama.cpp/models:/models
      - ./llama.cpp/scripts:/scripts
    command: sh /scripts/download_models.sh
    networks:
      - guard-network

  qwen-api:
    build:
      context: ./llama.cpp
      dockerfile: Dockerfile
    image: custom-llama-cpp:latest
    container_name: qwen-api
    restart: unless-stopped
    volumes:
      - ./llama.cpp/models:/models
      - ./llama.cpp/scripts:/scripts
    entrypoint: ["/bin/sh", "/scripts/start_qwen.sh"]
    depends_on:
      llama-downloader:
        condition: service_completed_successfully
    networks:
      - guard-network

  chromadb:
    image: chromadb/chroma:1.5.5
    container_name: chromadb
    restart: unless-stopped
    volumes:
      - ./chroma_data:/chroma/chroma
    networks:
      - guard-network

  redis:
    image: redis:8.10.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis_data:/data
    networks:
      - guard-network
