networks:
  guard-network:
    name: guard-network
    driver: bridge

services:
  pi-guard:
    image: pi-guard:latest
    build:
      context: .
      dockerfile: guard/Dockerfile
    container_name: pi-guard
    restart: unless-stopped
    # Reachable only through caddy, which serves it under /api over HTTPS.
    command: ["uvicorn", "guard.api.server:app", "--host", "0.0.0.0", "--port", "3000", "--root-path", "/api", "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - LIVE_STREAM_URL=rtsp://${RTSP_USER:?}:${RTSP_PASSWORD:?}@host.docker.internal:${RTSP_PORT:-8554}/${LIVE_CAMERA:-cam1}
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./videos:/app/videos
      - ./data:/app/data
    depends_on:
      chromadb:
        condition: service_healthy
      clip-api:
        condition: service_started
      qwen-api:
        condition: service_started
    networks:
      - guard-network

  caddy:
    image: caddy:2.11.7-alpine
    container_name: caddy
    restart: unless-stopped
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?}
      - DEFAULT_SNI=${DEFAULT_SNI:-localhost}
      - MANAGER_UPSTREAM=${MANAGER_UPSTREAM:-host.docker.internal:5173}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    ports:
      - 80:80
      - 443:443
    depends_on:
      - pi-guard
    networks:
      - guard-network

  guard-worker:
    image: pi-guard:latest
    container_name: guard-worker
    restart: unless-stopped
    command: ["python", "-m", "guard.worker.main"]
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./videos:/app/videos
      - ./data:/app/data
    depends_on:
      - chromadb
      - redis
      - clip-api
      - qwen-api
    networks:
      - guard-network

  guard-enrichment-worker:
    image: pi-guard:latest
    container_name: guard-enrichment-worker
    restart: unless-stopped
    command: ["python", "-m", "guard.worker.enrichment_main"]
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./videos:/app/videos
      - ./data:/app/data
    depends_on:
      - chromadb
      - redis
      - qwen-api
    networks:
      - guard-network

  clip-api:
    build:
      context: ./clip-api
      dockerfile: Dockerfile
    image: clip-api:latest
    container_name: clip-api
    restart: unless-stopped
    environment:
      - CLIP_MODEL=ViT-B/32
    networks:
      - guard-network

  recorder:
    image: recorder:latest
    build:
      context: ./recorder
      dockerfile: Dockerfile
    container_name: recorder
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - TZ=America/Sao_Paulo
      - RTSP_URL=rtsp://${RTSP_USER:?}:${RTSP_PASSWORD:?}@host.docker.internal:${RTSP_PORT:-8554}
      - RECORD_CAMERAS=${RECORD_CAMERAS:-cam1}
      - RECORD_SEGMENT_SECONDS=${RECORD_SEGMENT_SECONDS:-3600}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./videos:/app/videos
    networks:
      - guard-network

  watcher:
    image: watcher:latest
    build:
      context: ./watcher
      dockerfile: Dockerfile
    container_name: watcher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./videos:/app/videos
    depends_on:
      - redis
    networks:
      - guard-network

  llama-downloader:
    image: alpine:3.24.2
    container_name: llama-downloader
    volumes:
      - ./llama.cpp/models:/models
      - ./llama.cpp/scripts:/scripts
    command: sh /scripts/download_models.sh
    networks:
      - guard-network

  qwen-api:
    build:
      context: ./llama.cpp
      dockerfile: Dockerfile
    image: custom-llama-cpp:latest
    container_name: qwen-api
    restart: unless-stopped
    volumes:
      - ./llama.cpp/models:/models
      - ./llama.cpp/scripts:/scripts
    entrypoint: ["/bin/sh", "/scripts/start_qwen.sh"]
    depends_on:
      llama-downloader:
        condition: service_completed_successfully
    networks:
      - guard-network

  chromadb:
    image: chromadb/chroma:1.5.5
    container_name: chromadb
    restart: unless-stopped
    volumes:
      - ./chroma_data:/chroma/chroma
    # The image has no curl/wget; probe the heartbeat endpoint with bash's /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - guard-network

  redis:
    image: redis:8.10.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis_data:/data
    networks:
      - guard-network
