description: "Evaluates how well video frame descriptions match a user query."
version: "3.0"
template: |
  Compare the following frame descriptions to the user query: '{user_query}'

  Descriptions:
  {formatted_descriptions}

  Rate how well each description matches the query on a scale from 0 (no match) to 10 (perfect match).
  Output exactly {num_descriptions} lines, one per description, covering every index from 0 to {max_index}.
  Each line must be the description index, a colon, and the score. Do not write any other text.

  Example format for three descriptions:
  0: 8
  1: 2
  2: 5