description: "Evaluates how well video frame descriptions match a user query."
version: "2.0"
template: |
  Compare the following frame descriptions to the user query: '{user_query}'

  Descriptions:
  {formatted_descriptions}

  Rate how well each description matches the query from 0 to 10.
  Output ONLY the index and the score separated by a hyphen, one per line. Do not write any other text.

  Example format:
  0-10
  1-5
  2-0